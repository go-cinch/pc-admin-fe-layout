name: Sync PC Admin to Demos

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Frontend to sync
        type: choice
        default: all
        options:
          - all
          - vben-antd-vue3
          - art-eleplus-vue3
          - shadcn-react
          - tail-react

concurrency:
  group: sync-pc-admin-to-demos
  cancel-in-progress: false

env:
  DEMOS_REPO: go-cinch/demos
  DEMOS_BRANCH: main
  # Commit referenced by the immutable Scaffold v0.13.1 release tag.
  SCAFFOLD_COMMIT_SHA: a9385db9a94f5a6322998b14ae21d6d2a8819bd4
  PNPM_VERSION: 11.16.0
  VITE_GLOB_API_URL: https://entry.go-cinch.top/api/auth
  VITE_GLOB_AUTH_API_URL: https://entry.go-cinch.top/api/auth

jobs:
  changes:
    name: Select changed frontends
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
    steps:
      - name: Checkout PC admin layout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select frontend directories
        id: select
        env:
          SYNC_TARGET: ${{ inputs.target || 'all' }}
        shell: python
        run: |
          import json
          import os
          import subprocess

          projects = [
              {"name": "vben-antd-vue3"},
              {"name": "art-eleplus-vue3"},
              {"name": "shadcn-react"},
              {"name": "tail-react"},
          ]
          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)

          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              target = os.environ["SYNC_TARGET"]
              if target not in {"all", *(p["name"] for p in projects)}:
                  raise ValueError(f"Unknown sync target: {target}")
              selected = [p for p in projects if target in ("all", p["name"])]
          else:
              before = event.get("before", "")
              exists = before and set(before) != {"0"} and subprocess.run(
                  ["git", "cat-file", "-e", f"{before}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not exists:
                  selected = projects
              else:
                  changed = subprocess.check_output([
                      "git", "diff", "--no-renames", "--name-only", "-z",
                      before, "HEAD", "--",
                  ]).decode().split("\0")
                  shared_changed = any(
                      not path.startswith("{{ .Project }}/") for path in changed if path
                  )
                  selected = [
                      p for p in projects
                      if shared_changed or any(
                          path.startswith(f"{{{{ .Project }}}}/{p['name']}/")
                          for path in changed
                      )
                  ]

          matrix = json.dumps({"include": selected}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"matrix={matrix}", file=output)
              print(f"has_changes={str(bool(selected)).lower()}", file=output)
          print(matrix)

  sync:
    name: Generate and publish demos/${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout PC admin layout
        uses: actions/checkout@v4
        with:
          path: pc-admin-fe-layout

      - name: Check demos repository token
        env:
          DEMOS_REPO_TOKEN: ${{ secrets.DEMOS_REPO_TOKEN }}
        run: |
          if [ -z "${DEMOS_REPO_TOKEN:-}" ]; then
            echo "Missing secret DEMOS_REPO_TOKEN" >&2
            exit 1
          fi

      - name: Checkout demos repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEMOS_REPO }}
          ref: ${{ env.DEMOS_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.DEMOS_REPO_TOKEN }}
          path: demos

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false

      - name: Install Scaffold at pinned commit
        run: |
          go install "github.com/hay-kot/scaffold@${SCAFFOLD_COMMIT_SHA}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate and incrementally sync PC admin demo
        env:
          DEMO_PROJECT: ${{ matrix.name }}
        run: make -C "$GITHUB_WORKSPACE/pc-admin-fe-layout" local DEMO="$DEMO_PROJECT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Install frontend package managers
        run: npm install --global "pnpm@${PNPM_VERSION}" bun

      - name: Verify generated PC admin demo
        working-directory: demos/${{ matrix.name }}
        env:
          DEMO_PROJECT: ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "$DEMO_PROJECT" in
            vben-antd-vue3)
              pnpm install --frozen-lockfile
              pnpm check:type
              pnpm exec vitest run --dom \
                apps/web-antd/src/api/core/auth.test.ts \
                apps/web-antd/src/api/core/user.test.ts \
                apps/web-antd/src/api/system/index.test.ts
              ;;
            art-eleplus-vue3)
              pnpm install --frozen-lockfile
              pnpm run build
              ;;
            shadcn-react)
              bun install --frozen-lockfile
              bun run build
              ;;
            tail-react)
              npm ci
              npm run build
              ;;
          esac

      - name: Commit and push PC admin demo
        working-directory: demos
        env:
          DEMO_PROJECT: ${{ matrix.name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DEMO_PROJECT"

          if git diff --cached --quiet; then
            echo "demos/$DEMO_PROJECT is already up to date"
            exit 0
          fi

          git commit -m "[chore] $DEMO_PROJECT sync pc-admin-fe-layout ${SOURCE_SHA:0:7}"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$DEMOS_BRANCH"
            git merge --no-edit "origin/$DEMOS_BRANCH"

            if git push origin "HEAD:${DEMOS_BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Failed to push demos/$DEMO_PROJECT after $max_attempts attempts" >&2
              exit 1
            fi

            echo "demos/$DEMOS_BRANCH changed during push; retrying ($attempt/$max_attempts)"
            sleep $((attempt * 2))
          done
