name: Sync PC Admin to Demos

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-pc-admin-to-demos
  cancel-in-progress: false

env:
  DEMOS_REPO: go-cinch/demos
  DEMOS_BRANCH: main
  DEMO_PROJECT: vben-antd-vue3-pc-admin
  # Commit referenced by the immutable Scaffold v0.13.1 release tag.
  SCAFFOLD_COMMIT_SHA: a9385db9a94f5a6322998b14ae21d6d2a8819bd4
  PNPM_VERSION: 11.16.0
  VITE_GLOB_API_URL: https://entry.go-cinch.top/api/auth
  VITE_GLOB_AUTH_API_URL: https://entry.go-cinch.top/api/auth

jobs:
  sync:
    name: Generate and publish demos/vben-antd-vue3-pc-admin
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout PC admin layout
        uses: actions/checkout@v4
        with:
          path: pc-admin-fe-layout

      - name: Check demos repository token
        env:
          DEMOS_REPO_TOKEN: ${{ secrets.DEMOS_REPO_TOKEN }}
        run: |
          if [ -z "${DEMOS_REPO_TOKEN:-}" ]; then
            echo "Missing secret DEMOS_REPO_TOKEN" >&2
            exit 1
          fi

      - name: Checkout demos repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEMOS_REPO }}
          ref: ${{ env.DEMOS_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.DEMOS_REPO_TOKEN }}
          path: demos

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: false

      - name: Install Scaffold at pinned commit
        run: |
          go install "github.com/hay-kot/scaffold@${SCAFFOLD_COMMIT_SHA}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate and incrementally sync PC admin demo
        run: make -C "$GITHUB_WORKSPACE/pc-admin-fe-layout" local-vben-antd-vue3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: demos/vben-antd-vue3-pc-admin/.node-version

      - name: Install pnpm
        run: npm install --global "pnpm@${PNPM_VERSION}"

      - name: Verify generated PC admin demo
        working-directory: demos/vben-antd-vue3-pc-admin
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check:type
          pnpm exec vitest run --dom \
            apps/web-antd/src/api/core/auth.test.ts \
            apps/web-antd/src/api/core/user.test.ts \
            apps/web-antd/src/api/system/index.test.ts

      - name: Commit and push PC admin demo
        working-directory: demos
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DEMO_PROJECT"

          if git diff --cached --quiet; then
            echo "demos/$DEMO_PROJECT is already up to date"
            exit 0
          fi

          git commit -m "[chore] vben-antd-vue3-pc-admin sync pc-admin-fe-layout ${SOURCE_SHA:0:7}"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin "$DEMOS_BRANCH"
            git merge --no-edit "origin/$DEMOS_BRANCH"

            if git push origin "HEAD:${DEMOS_BRANCH}"; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Failed to push demos/$DEMO_PROJECT after $max_attempts attempts" >&2
              exit 1
            fi

            echo "demos/$DEMOS_BRANCH changed during push; retrying ($attempt/$max_attempts)"
            sleep $((attempt * 2))
          done
