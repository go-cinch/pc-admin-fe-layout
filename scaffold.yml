# yaml-language-server: $schema=https://hay-kot.github.io/scaffold/schema.json
messages:
  pre: |
    # Go-Cinch PC Admin Generator
    Generate an admin frontend connected to chi-auth-layout.
  post: |
    # Project Created: {{ .Scaffold.Project }}
    UI: {{ .Computed.ui_final }}

    Next steps:
      cd {{ .Scaffold.Project }}
      install dependencies with the generated project's locked package manager
      start the generated project's development server

    Browser API base: /api/auth

questions:
  - name: brand_name
    prompt:
      message: Brand name (title, lowercase and kebab-case are derived automatically)?
      default: go cinch

  - name: ui
    prompt:
      message: Admin UI?
      type: select
      options: [vben-antd-vue3, tail-react, art-eleplus-vue3, shadcn-react, tdesign-vue3-h5, ant-design-h5]
      default: vben-antd-vue3

  - name: github_url
    prompt:
      message: Brand GitHub URL (leave empty for https://github.com/<brand>/demos)?

  - name: logo_path
    prompt:
      message: Local logo absolute path (optional; SVG, PNG, JPG, JPEG, WebP, GIF or ICO)?

  - name: VITE_GLOB_API_URL
    prompt:
      message: Production API URL?

  - name: VITE_GLOB_AUTH_API_URL
    prompt:
      message: Production auth API URL?

computed:
  github_url_final: '{{ $url := or .Scaffold.github_url (printf "https://github.com/%s/demos" (replace " " "-" (toLower (regexReplaceAll "[ _-]+" (trim (or .Scaffold.brand_name "go cinch")) " ")))) }}{{ if not (regexMatch "^https?://[A-Za-z0-9._~:/?#@!&%+=,-]+$" $url) }}{{ template "github_url must be an HTTP or HTTPS URL without quotes, spaces or template expressions" . }}{{ end }}{{ $url }}'
  logo_ext: '{{ if and .Scaffold.logo_path (not (regexMatch "^/" .Scaffold.logo_path)) }}{{ template "logo_path must be an absolute path" . }}{{ end }}{{ $ext := (toLower (regexFind "(?i)\\.(svg|png|jpe?g|webp|gif|ico)$" (or .Scaffold.logo_path "logo.svg"))) }}{{ if not $ext }}{{ template "logo_path must end in svg, png, jpg, jpeg, webp, gif or ico" . }}{{ end }}{{ $ext }}'
  production_api_url: '{{ or .Scaffold.VITE_GLOB_API_URL (ternary "https://entry.go-cinch.top/api/auth" "/api/auth" (eq (replace " " "-" (toLower (regexReplaceAll "[ _-]+" (trim (or .Scaffold.brand_name "go cinch")) " "))) "go-cinch")) }}'
  production_auth_api_url: '{{ or .Scaffold.VITE_GLOB_AUTH_API_URL (ternary "https://entry.go-cinch.top/api/auth" "/api/auth" (eq (replace " " "-" (toLower (regexReplaceAll "[ _-]+" (trim (or .Scaffold.brand_name "go cinch")) " "))) "go-cinch")) }}'
  # JSON preserves string names such as "true"; Scaffold coerces scalar computed values.
  brand: '{{ $raw := trim (or .Scaffold.brand_name "go cinch") }}{{ if not (regexMatch "^[A-Za-z][A-Za-z0-9]*([ _-]+[A-Za-z0-9]+)*$" $raw) }}{{ template "brand_name must start with a letter and contain only English letters, digits, spaces, underscores or hyphens" . }}{{ end }}{{ $lower := toLower (regexReplaceAll "[ _-]+" $raw " ") }}{{ dict "title" (toTitleCase $lower) "admin_title" (printf "%s Admin" (toTitleCase $lower)) "lower" $lower "slug" (replace " " "-" $lower) | toJSON }}'
  # Native template errors reject invalid CLI values before writing any files.
  ui_final: '{{ $ui := or .Scaffold.ui "vben-antd-vue3" }}{{ if or (eq $ui "vben-antd-vue3") (eq $ui "vben") }}vben-antd-vue3{{ else if or (eq $ui "tail-react") (eq $ui "tail") }}tail-react{{ else if or (eq $ui "art-eleplus-vue3") (eq $ui "art") }}art-eleplus-vue3{{ else if or (eq $ui "shadcn-react") (eq $ui "shadcn") }}shadcn-react{{ else if or (eq $ui "tdesign-vue3-h5") (eq $ui "tdesign-h5") }}tdesign-vue3-h5{{ else if or (eq $ui "ant-design-h5") (eq $ui "antd-h5") }}ant-design-h5{{ else }}{{ template "ui must be vben-antd-vue3 (alias vben), tail-react (alias tail), art-eleplus-vue3 (alias art), shadcn-react (alias shadcn), tdesign-vue3-h5 (alias tdesign-h5), or ant-design-h5 (alias antd-h5)" . }}{{ end }}'

# Keep Vue {{ expressions }} and embedded template strings intact.
# Only [[scaffold ... scaffold]] is interpreted as Scaffold syntax in file contents.
delimiters:
  - glob: '**/*'
    left: '[[scaffold'
    right: 'scaffold]]'

features:
  - value: '{{ eq .Computed.ui_final "vben-antd-vue3" }}'
    globs: ['**/vben-antd-vue3/**']
  - value: '{{ eq .Computed.ui_final "tail-react" }}'
    globs: ['**/tail-react/**']
  - value: '{{ eq .Computed.ui_final "art-eleplus-vue3" }}'
    globs: ['**/art-eleplus-vue3/**']
  - value: '{{ eq .Computed.ui_final "shadcn-react" }}'
    globs: ['**/shadcn-react/**']
  - value: '{{ eq .Computed.ui_final "tdesign-vue3-h5" }}'
    globs: ['**/tdesign-vue3-h5/**']
  - value: '{{ eq .Computed.ui_final "ant-design-h5" }}'
    globs: ['**/ant-design-h5/**']
  # Exclude installed dependencies and local artifacts even if they exist locally.
  - value: 'false'
    globs:
      - '**/node_modules/**'
      - '**/.pnpm-store/**'
      - '**/.yarn/**'
      - '**/dist/**'
      - '**/dist-ssr/**'
      - '**/dev-dist/**'
      - '**/dist.zip'
      - '**/dist.tar'
      - '**/dist.war'
      - '**/*-dist.zip'
      - '**/.turbo/**'
      - '**/.cache/**'
      - '**/.vite/**'
      - '**/.nitro/**'
      - '**/.output/**'
      - '**/.next/**'
      - '**/out/**'
      - '**/build/**'
      - '**/coverage/**'
      - '**/__pycache__/**'
      - '**/.git/**'
      - '**/.DS_Store'
      - '**/*.log'
      - '**/*.local'
      - '**/*.tsbuildinfo'
      - '**/.eslintcache'
      - '**/.stylelintcache'

presets:
  full:
    ui: vben-antd-vue3
  vben-antd-vue3:
    ui: vben-antd-vue3
  vben:
    ui: vben-antd-vue3
  tail-react:
    ui: tail-react
  tail:
    ui: tail-react
  art-eleplus-vue3:
    ui: art-eleplus-vue3
  art:
    ui: art-eleplus-vue3
  shadcn-react:
    ui: shadcn-react
  shadcn:
    ui: shadcn-react
  tdesign-vue3-h5:
    ui: tdesign-vue3-h5
  tdesign-h5:
    ui: tdesign-vue3-h5
  ant-design-h5:
    ui: ant-design-h5
  antd-h5:
    ui: ant-design-h5
