# yaml-language-server: $schema=https://hay-kot.github.io/scaffold/schema.json
messages:
  pre: |
    # Go-Cinch PC Admin Generator
    Generate an admin frontend connected to chi-auth-layout.
  post: |
    # Project Created: {{ .Scaffold.Project }}
    UI: {{ .Computed.ui_final }}

    Next steps:
      cd {{ .Scaffold.Project }}
      install dependencies with the generated project's locked package manager
      start the generated project's development server

    Browser API base: /api/auth

questions:
  - name: ui
    prompt:
      message: Admin UI?
      type: select
      options: [vben-antd-vue3, tail-react, art-eleplus-vue3, shadcn-react, tdesign-vue3-mobile, ant-design-mobile, ant-design-mini, tdesign-mini, wot-ui-mini]
      default: vben-antd-vue3

  - name: VITE_GLOB_API_URL
    prompt:
      message: Production API URL?
      default: https://entry.go-cinch.top/api/auth

  - name: VITE_GLOB_AUTH_API_URL
    prompt:
      message: Production auth API URL?
      default: https://entry.go-cinch.top/api/auth

computed:
  # Native template errors reject invalid CLI values before writing any files.
  ui_final: '{{ $ui := or .Scaffold.ui "vben-antd-vue3" }}{{ if or (eq $ui "vben-antd-vue3") (eq $ui "vben") }}vben-antd-vue3{{ else if or (eq $ui "tail-react") (eq $ui "tail") }}tail-react{{ else if or (eq $ui "art-eleplus-vue3") (eq $ui "art") }}art-eleplus-vue3{{ else if or (eq $ui "shadcn-react") (eq $ui "shadcn") }}shadcn-react{{ else if or (eq $ui "tdesign-vue3-mobile") (eq $ui "tdesign-mobile") }}tdesign-vue3-mobile{{ else if or (eq $ui "ant-design-mobile") (eq $ui "antd-mobile") }}ant-design-mobile{{ else if eq $ui "ant-design-mini" }}ant-design-mini{{ else if eq $ui "tdesign-mini" }}tdesign-mini{{ else if eq $ui "wot-ui-mini" }}wot-ui-mini{{ else }}{{ template "ui must be vben-antd-vue3 (alias vben), tail-react (alias tail), art-eleplus-vue3 (alias art), shadcn-react (alias shadcn), tdesign-vue3-mobile (alias tdesign-mobile), ant-design-mobile (alias antd-mobile), ant-design-mini, tdesign-mini, or wot-ui-mini" . }}{{ end }}'

# Keep Vue {{ expressions }} and embedded template strings intact.
# Only [[scaffold ... scaffold]] is interpreted as Scaffold syntax in file contents.
delimiters:
  - glob: '**/*'
    left: '[[scaffold'
    right: 'scaffold]]'

features:
  - value: '{{ eq .Computed.ui_final "vben-antd-vue3" }}'
    globs: ['**/vben-antd-vue3/**']
  - value: '{{ eq .Computed.ui_final "tail-react" }}'
    globs: ['**/tail-react/**']
  - value: '{{ eq .Computed.ui_final "art-eleplus-vue3" }}'
    globs: ['**/art-eleplus-vue3/**']
  - value: '{{ eq .Computed.ui_final "shadcn-react" }}'
    globs: ['**/shadcn-react/**']
  - value: '{{ eq .Computed.ui_final "tdesign-vue3-mobile" }}'
    globs: ['**/tdesign-vue3-mobile/**']
  - value: '{{ eq .Computed.ui_final "ant-design-mobile" }}'
    globs: ['**/ant-design-mobile/**']
  - value: '{{ eq .Computed.ui_final "ant-design-mini" }}'
    globs: ['**/ant-design-mini/**']
  - value: '{{ eq .Computed.ui_final "tdesign-mini" }}'
    globs: ['**/tdesign-mini/**']
  - value: '{{ eq .Computed.ui_final "wot-ui-mini" }}'
    globs: ['**/wot-ui-mini/**']
  - value: '{{ or (eq .Computed.ui_final "ant-design-mini") (eq .Computed.ui_final "tdesign-mini") (eq .Computed.ui_final "wot-ui-mini") }}'
    globs: ['**/_mini-core/**']
  # Exclude installed dependencies and local artifacts even if they exist locally.
  - value: 'false'
    globs:
      - '**/node_modules/**'
      - '**/.pnpm-store/**'
      - '**/.yarn/**'
      - '**/dist/**'
      - '**/dist-ssr/**'
      - '**/dev-dist/**'
      - '**/dist.zip'
      - '**/dist.tar'
      - '**/dist.war'
      - '**/*-dist.zip'
      - '**/.turbo/**'
      - '**/.cache/**'
      - '**/.vite/**'
      - '**/.nitro/**'
      - '**/.output/**'
      - '**/.next/**'
      - '**/out/**'
      - '**/build/**'
      - '**/coverage/**'
      - '**/__pycache__/**'
      - '**/.git/**'
      - '**/.DS_Store'
      - '**/*.log'
      - '**/*.local'
      - '**/project.private.config.json'
      - '**/*.tsbuildinfo'
      - '**/.eslintcache'
      - '**/.stylelintcache'

presets:
  full:
    ui: vben-antd-vue3
  vben-antd-vue3:
    ui: vben-antd-vue3
  vben:
    ui: vben-antd-vue3
  tail-react:
    ui: tail-react
  tail:
    ui: tail-react
  art-eleplus-vue3:
    ui: art-eleplus-vue3
  art:
    ui: art-eleplus-vue3
  shadcn-react:
    ui: shadcn-react
  shadcn:
    ui: shadcn-react
  tdesign-vue3-mobile:
    ui: tdesign-vue3-mobile
  tdesign-mobile:
    ui: tdesign-vue3-mobile
  ant-design-mobile:
    ui: ant-design-mobile
  antd-mobile:
    ui: ant-design-mobile
  ant-design-mini:
    ui: ant-design-mini
  tdesign-mini:
    ui: tdesign-mini
  wot-ui-mini:
    ui: wot-ui-mini
