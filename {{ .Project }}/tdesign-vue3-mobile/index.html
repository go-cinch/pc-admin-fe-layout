<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="description" content="Go Cinch · Mobile Admin" />
    <title>Go Cinch · TDesign Mobile</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="%BASE_URL%go-cinch.svg" />
    <script>
      (() => {
        let dark = false;
        let accent = 'graphite';
        try {
          const stored = JSON.parse(localStorage.getItem('cinch-mobile-preferences') || '{}');
          dark = stored.dark === true;
          if (['jade', 'green'].includes(stored.accent)) accent = 'jade';
          else if (['berry', 'violet'].includes(stored.accent)) accent = 'berry';
        } catch {
          /* Use application defaults when storage is unavailable or invalid. */
        }
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = accent;
        document.documentElement.setAttribute('theme-mode', theme);
        const colors = {
          graphite: ['#f5f5f5', '#202226'],
          jade: ['#f4f7f5', '#17231f'],
          berry: ['#f5f5f7', '#211c25'],
        };
        document.querySelector('meta[name="theme-color"]').content = colors[accent][dark ? 1 : 0];
      })();
    </script>
  </head>
  <body>
    <div id="app-bootstrap-loading" role="status" aria-label="Loading">
      <span class="bootstrap-loading-orb" aria-hidden="true"></span>
    </div>
    <script>
      // Never leave the static startup cover behind when a bundle or request stalls.
      window.setTimeout(() => document.querySelector('#app-bootstrap-loading')?.remove(), 5000);
    </script>
    <style>
      #app-bootstrap-loading {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: #f5f5f5;
        color: #3366b8;
        --bootstrap-shadow: rgba(51, 102, 184, 0.28);
      }
      :root[data-accent='jade'] #app-bootstrap-loading {
        background: #f4f7f5;
        color: #087b69;
        --bootstrap-shadow: rgba(8, 123, 105, 0.28);
      }
      :root[data-accent='berry'] #app-bootstrap-loading {
        background: #f5f5f7;
        color: #a62b56;
        --bootstrap-shadow: rgba(166, 43, 86, 0.28);
      }
      .bootstrap-loading-orb {
        position: relative;
        width: 12px;
        height: 12px;
        background: currentColor;
        border-radius: 50%;
        animation: bootstrap-orb-breathe 1.6s ease-in-out infinite;
      }
      .bootstrap-loading-orb::after {
        position: absolute;
        inset: -8px;
        border: 1px solid currentColor;
        border-radius: 50%;
        opacity: 0.18;
        content: '';
      }
      @keyframes bootstrap-orb-breathe {
        0%,
        100% {
          transform: scale(0.88);
          box-shadow: 0 0 0 0 var(--bootstrap-shadow);
          opacity: 0.72;
        }
        50% {
          transform: scale(1);
          box-shadow: 0 0 0 12px transparent;
          opacity: 1;
        }
      }
      :root[data-theme='dark'] #app-bootstrap-loading {
        background: #202226;
        color: #9cbbeb;
        --bootstrap-shadow: rgba(156, 187, 235, 0.25);
      }
      :root[data-theme='dark'][data-accent='jade'] #app-bootstrap-loading {
        background: #17231f;
        color: #93d2bc;
        --bootstrap-shadow: rgba(147, 210, 188, 0.25);
      }
      :root[data-theme='dark'][data-accent='berry'] #app-bootstrap-loading {
        background: #211c25;
        color: #f0a6c0;
        --bootstrap-shadow: rgba(240, 166, 192, 0.25);
      }
      @media (prefers-reduced-motion: reduce) {
        .bootstrap-loading-orb {
          animation: none;
          opacity: 0.85;
        }
      }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
