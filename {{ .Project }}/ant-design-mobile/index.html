<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f3f4" />
    <meta name="description" content="Cinch 绛钛 · Ant Design Mobile 管理空间" />
    <link rel="icon" href="/go-cinch.svg" />
    <title>Cinch · 绛钛</title>
  </head>
  <body>
    <div id="app-bootstrap-loading" role="status" aria-label="Loading">
      <span class="bootstrap-loading-orb" aria-hidden="true"></span>
    </div>
    <script>
      window.setTimeout(() => document.querySelector('#app-bootstrap-loading')?.remove(), 5000);
    </script>
    <style>
      #app-bootstrap-loading {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        background: #f6f3f4;
        color: #8b2635;
        --bootstrap-shadow: rgba(139, 38, 53, 0.28);
      }
      :root[data-theme='dark'] #app-bootstrap-loading {
        background: #171214;
        color: #e9bbc2;
        --bootstrap-shadow: rgba(233, 187, 194, 0.25);
      }
      .bootstrap-loading-orb {
        position: relative;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: currentColor;
        animation: bootstrap-orb-breathe 1.6s ease-in-out infinite;
      }
      .bootstrap-loading-orb::after {
        position: absolute;
        inset: -8px;
        border: 1px solid currentColor;
        border-radius: 50%;
        opacity: 0.18;
        content: '';
      }
      @keyframes bootstrap-orb-breathe {
        0%,
        100% {
          transform: scale(0.88);
          box-shadow: 0 0 0 0 var(--bootstrap-shadow);
          opacity: 0.72;
        }
        50% {
          transform: scale(1);
          box-shadow: 0 0 0 12px transparent;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bootstrap-loading-orb {
          animation: none;
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
